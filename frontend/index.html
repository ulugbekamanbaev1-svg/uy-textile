
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#f3ecdf" />

    <style>
      html { background: #0b0c0e; }
      html[data-theme="light"] { background: #f3ecdf; }
    </style>

    <meta
      name="description"
      content="Farrux Shop (Hozoosp) — магазин домашнего текстиля: наволочки, простыни, комплекты и ткани."
    />

    <!-- PWA настройки -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icon-192.png"
    />

    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="Farrux Shop"
    />

    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Farrux Shop — Домашний текстиль</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Apply the saved theme before the first paint -->
    <script>
      (function () {
        var theme = null;

        try {
          theme = localStorage.getItem("uy_theme");
        } catch (error) {
          // localStorage may be unavailable
        }

        if (theme !== "light" && theme !== "dark") {
          var scheme =
            window.Telegram &&
            window.Telegram.WebApp &&
            window.Telegram.WebApp.colorScheme;

          theme = scheme === "light" || scheme === "dark" ? scheme : null;
        }

        if (!theme) {
          try {
            theme = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          } catch (error) {
            theme = "dark";
          }
        }

        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!-- Запуск React приложения -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- Регистрация PWA Service Worker -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then(() => {
              console.log("Farrux Shop PWA успешно запущен");
            })
            .catch((error) => {
              console.error("Ошибка PWA:", error);
            });
        });
      }
    </script>
  </body>
</html>
