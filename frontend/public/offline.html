<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5f0" />
    <title>Farrux shop (Hozorosp) — Нет соединения</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f7f5f0;
        color: #2f2d28;
      }
      .card {
        max-width: 360px;
        margin: 24px;
        padding: 28px 24px;
        background: #fff;
        border: 1px solid #e7e2d8;
        border-radius: 16px;
        text-align: center;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 16px; color: #6f6b60; font-size: 14px; line-height: 1.5; }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        font: inherit;
        font-weight: 600;
        background: #2f2d28;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Нет соединения</h1>
      <p>Farrux shop (Hozorosp) сейчас недоступен. Проверьте интернет и попробуйте снова.</p>
      <button type="button" onclick="location.reload()">Повторить</button>
    </main>
  </body>
</html>
